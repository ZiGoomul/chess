<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматные этюды</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--panel-bg); box-shadow: var(--shadow); margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 24px; color: var(--text-color);">Шахматные этюды</h1>
        <button id="themeToggleBtn" style="padding: 8px 12px; border-radius: 20px; background: none; color: var(--text-color); border: 1px solid var(--border-color); box-shadow: none;">☀️ / 🌙</button>
    </div>

    <div class="main-layout" style="display: flex; gap: 30px; max-width: 1400px; margin: 0 auto; padding: 0 20px; align-items: flex-start; flex-wrap: wrap;">
        <!-- Left Column: Board -->
        <div class="board-column" style="flex: 2; min-width: 320px; width: 100%;">
            <div id="boardContainer" style="display: flex; flex-direction: column; width: 100%; box-shadow: none; background: transparent; padding: 0;">
                <div style="min-height: 25px; display: flex; align-items: center; margin-bottom: 5px; margin-left: 35px;">
                    <div id="topMaterial" class="material-row" style="flex: 1; display: flex; align-items: center;"></div>
                    <div id="topClock" class="chess-clock">05:00</div>
                </div>
                
                <div style="display: flex; flex-direction: row; align-items: stretch; gap: 10px; width: 100%;">
                    <!-- Eval Bar -->
                    <div id="evalBarContainer" style="flex: 0 0 25px; border-radius: 4px; overflow: hidden; position: relative; background-color: #303030; border: 1px solid var(--border-color);">
                        <div id="evalBarWhite" style="position: absolute; bottom: 0; width: 100%; height: 50%; background-color: #eaeaea; transition: height 0.3s ease-out, top 0.3s ease-out, bottom 0.3s ease-out;"></div>
                        <div id="evalBarText" style="position: absolute; width: 100%; text-align: center; font-size: 11px; font-weight: bold; color: #888; z-index: 2; top: 10px; transition: color 0.3s;">0.0</div>
                    </div>
                    
                    <div style="position: relative; box-shadow: var(--shadow); border-radius: 4px; overflow: hidden; flex: 1;">
                        <div id="myBoard" style="width: 100%"></div>
                        
                        <svg id="arrowOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;">
                            <defs>
                            <marker id="arrowhead1" markerWidth="3" markerHeight="3" refX="2" refY="1.5" orient="auto">
                                <path d="M0,0 L0,3 L3,1.5 z" fill="rgba(46, 204, 113, 0.8)" />
                            </marker>
                            <marker id="arrowhead2" markerWidth="3" markerHeight="3" refX="2" refY="1.5" orient="auto">
                                <path d="M0,0 L0,3 L3,1.5 z" fill="rgba(52, 152, 219, 0.8)" />
                            </marker>
                            <marker id="arrowhead3" markerWidth="3" markerHeight="3" refX="2" refY="1.5" orient="auto">
                                <path d="M0,0 L0,3 L3,1.5 z" fill="rgba(155, 89, 182, 0.8)" />
                            </marker>
                        </defs>
                        <g id="arrowsGroup"></g>
                    </svg>

                    <div id="gameOverOverlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: white; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; flex-direction: column; z-index: 10;">
                        <span id="gameOverText" style="text-align: center;">МАТ</span>
                        <button id="closeOverlayBtn" style="margin-top: 20px; font-size: 16px; background: #e74c3c; border-radius: 4px; border: none; padding: 10px 20px; color: white; cursor: pointer;">Скрыть</button>
                    </div>
                    </div>
                </div>

                <div style="min-height: 25px; display: flex; align-items: center; margin-top: 5px; margin-left: 35px;">
                    <div id="bottomMaterial" class="material-row" style="flex: 1; display: flex; align-items: center;"></div>
                    <div id="bottomClock" class="chess-clock">05:00</div>
                </div>
            </div>
            <div class="board-actions">
                <button id="flipOrientationBtn" class="flip-board-btn" aria-label="Перевернуть доску" title="Перевернуть доску">⟳ <span>Перевернуть доску</span></button>
                <button id="newGameBtn" class="new-game-btn">Новая партия</button>
            </div>
        </div>

        <!-- Middle Column: Move History -->
        <div class="history-column" style="flex: 0 0 250px; background-color: var(--panel-bg); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; height: 500px; padding-bottom: 10px;" aria-labelledby="moveHistoryTitle">
            <h3 id="moveHistoryTitle" style="margin: 0; padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 16px; text-align: center;">История ходов</h3>
            <div id="moveHistoryList" role="list" aria-label="Ходы партии" style="flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 14px; display: flex; flex-direction: column; gap: 4px;"></div>
            <div style="display: flex; gap: 5px; padding: 0 10px; justify-content: center; margin-top: 10px;">
                <button id="navFirstBtn" class="nav-btn" aria-label="К начальной позиции" title="К начальной позиции">|◀</button>
                <button id="navPrevBtn" class="nav-btn" aria-label="Предыдущая позиция" title="Предыдущая позиция">◀</button>
                <button id="navNextBtn" class="nav-btn" aria-label="Следующая позиция" title="Следующая позиция">▶</button>
                <button id="navLastBtn" class="nav-btn" aria-label="К последней позиции" title="К последней позиции">▶|</button>
            </div>
        </div>

        <!-- Right Column: Sidebar -->
        <div class="sidebar-column" style="flex: 1; min-width: 300px; background: var(--panel-bg); border-radius: 8px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; min-height: 500px;">
            
            <div class="tabs-header" role="tablist" aria-label="Разделы приложения" aria-orientation="horizontal" style="display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;">
                <button id="tab-play-button" class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-play" tabindex="0" data-tab="tab-play" style="flex: 1; background: none; color: var(--text-color); box-shadow: none; border-radius: 0; padding: 10px; border: none; border-bottom: 2px solid var(--accent-color); font-weight: bold;">Игра</button>
                <button id="tab-puzzles-button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-puzzles" tabindex="-1" data-tab="tab-puzzles" style="flex: 1; background: none; color: var(--text-color); box-shadow: none; border-radius: 0; padding: 10px; border: none; border-bottom: 2px solid transparent;">Задачи</button>
                <button id="tab-setup-button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-setup" tabindex="-1" data-tab="tab-setup" style="flex: 1; background: none; color: var(--text-color); box-shadow: none; border-radius: 0; padding: 10px; border: none; border-bottom: 2px solid transparent;">Ред</button>
                <button id="tab-style-button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-style" tabindex="-1" data-tab="tab-style" style="flex: 1; background: none; color: var(--text-color); box-shadow: none; border-radius: 0; padding: 10px; border: none; border-bottom: 2px solid transparent;">Вид</button>
            </div>

            <!-- TAB: Puzzles -->
            <div class="tab-content" id="tab-puzzles" role="tabpanel" aria-labelledby="tab-puzzles-button" aria-hidden="true" style="display: none; flex-direction: column; gap: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Решение задач</h3>
                    <span id="puzzlesScore" style="font-weight: bold; color: var(--accent-color);">Решено: 0</span>
                </div>
                
                <div style="background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div id="puzzleStatusText" style="font-size: 16px; font-weight: bold; margin-bottom: 10px; text-align: center;">Нажмите "Новая задача", чтобы начать!</div>
                    <div id="puzzleDescText" style="font-size: 14px; color: #888; text-align: center; min-height: 20px;"></div>
                </div>

                <button id="loadPuzzleBtn" style="padding: 12px; font-size: 16px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Новая случайная задача</button>
                <button id="exitPuzzleBtn" style="padding: 10px; font-size: 14px; background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;">Выйти из режима задач</button>
            </div>

            <!-- TAB 1: Play -->
            <div class="tab-content" id="tab-play" role="tabpanel" aria-labelledby="tab-play-button" aria-hidden="false" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="background: rgba(0,0,0,0.05); padding: 15px; border-radius: 8px; text-align: center;">
                    <span id="gameStatus" role="status" aria-live="polite" aria-atomic="true" style="font-weight: bold; font-size: 18px; color: var(--accent-color);"></span>
                </div>

                <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                    Играть против:
                    <select id="botLevel">
                        <option value="0">Откл. (Редактор позиций)</option>
                        <option value="1">Бот: Ур 1 (~800 ELO)</option>
                        <option value="5">Бот: Ур 5 (~1200 ELO)</option>
                        <option value="10">Бот: Ур 10 (~1700 ELO)</option>
                        <option value="15">Бот: Ур 15 (~2200 ELO)</option>
                        <option value="20">Бот: Ур 20 (~3000+ ELO)</option>
                    </select>
                </label>

                <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                        Сила подсказки:
                        <select id="hintLevel">
                            <option value="1">Ур 1 (~800 ELO)</option>
                            <option value="5">Ур 5 (~1200 ELO)</option>
                            <option value="10" selected>Ур 10 (~1700 ELO)</option>
                            <option value="15">Ур 15 (~2200 ELO)</option>
                            <option value="20">Ур 20 (~3000+ ELO)</option>
                        </select>
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; margin-top: 5px;">
                        <div class="switch"><input type="checkbox" id="autoHintCb"><span class="slider"></span></div> Авто-подсказка
                    </label>

                    <div style="border-top: 1px solid var(--border-color); margin: 15px 0;"></div>

                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <div class="switch"><input type="checkbox" id="timerEnableCb" checked><span class="slider"></span></div> Игра на время
                    </label>
                    
                    <div id="timerSettingsRow" class="timer-settings">
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <label style="font-size: 12px; color: #888; margin-bottom: 4px;">Минут</label>
                            <select id="timerBase">
                                <option value="1">1 мин</option>
                                <option value="2">2 мин</option>
                                <option value="3">3 мин</option>
                                <option value="5" selected>5 мин</option>
                                <option value="10">10 мин</option>
                                <option value="15">15 мин</option>
                                <option value="30">30 мин</option>
                                <option value="60">60 мин</option>
                            </select>
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <label style="font-size: 12px; color: #888; margin-bottom: 4px;">Добавление (сек)</label>
                            <select id="timerInc">
                                <option value="0" selected>0 сек</option>
                                <option value="1">+1 сек</option>
                                <option value="2">+2 сек</option>
                                <option value="3">+3 сек</option>
                                <option value="5">+5 сек</option>
                                <option value="10">+10 сек</option>
                                <option value="15">+15 сек</option>
                                <option value="30">+30 сек</option>
                            </select>
                        </div>
                    </div>
                    <button id="hintBtn" style="background-color: #27ae60; margin-top: 5px;">Подсказать лучший ход</button>
                </div>
            </div>

            <!-- TAB 2: Setup -->
            <div class="tab-content" id="tab-setup" role="tabpanel" aria-labelledby="tab-setup-button" aria-hidden="true" style="display: none; flex-direction: column; gap: 15px;">
                <button id="startPositionBtn" style="background-color: #e67e22;">Начальная позиция</button>
                <button id="clearBoardBtn" style="background-color: #e74c3c;">Очистить доску</button>

                <div style="border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    <label style="font-weight: bold;">FEN позиция:</label>
                    <input type="text" id="fenInput" aria-describedby="fenError" placeholder="Введите FEN" style="width: 100%; box-sizing: border-box;">
                    <div id="fenError" class="fen-error" role="alert" aria-live="assertive" style="display: none;"></div>
                    <div style="display: flex; gap: 10px;">
                        <button id="setFenBtn" style="flex: 1;">Установить</button>
                        <button id="getFenBtn" style="flex: 1;">Получить</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: Style -->
            <div class="tab-content" id="tab-style" role="tabpanel" aria-labelledby="tab-style-button" aria-hidden="true" style="display: none; flex-direction: column; gap: 15px;">
                <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                    Стиль фигур:
                    <select id="pieceThemeSelect">
                        <option value="chesscom_neo">Neo (Chess.com)</option>
                        <option value="chesscom_classic">Классика (Chess.com)</option>
                        <option value="wikipedia">Wikipedia (Классика)</option>
                        <option value="cburnett">CBurnett (Lichess)</option>
                        <option value="merida">Merida</option>
                        <option value="alpha">Alpha</option>
                        <option value="california">California</option>
                        <option value="staunty">Staunty</option>
                    </select>
                </label>

                <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                    Цвет доски:
                    <select id="boardThemeSelect">
                        <option value="green">Зеленая (Chess.com)</option>
                        <option value="wood">Деревянная (Классика)</option>
                        <option value="blue">Синяя (Lichess)</option>
                        <option value="gray">Серая (Минимализм)</option>
                    </select>
                </label>

                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                    <div class="switch"><input type="checkbox" id="highlightMovesCb" checked><span class="slider"></span></div> Подсвечивать возможные ходы
                </label>
            </div>

        </div>
    </div>

    <!-- jQuery, Chessboard.js & Chess.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
